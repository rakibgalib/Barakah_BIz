services:
  postgres:
    image: citusdata/citus:12.1
    container_name: barakah-postgres
    environment:
      POSTGRES_USER: barakah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barakah_dev}
      POSTGRES_DB: barakah
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barakah -d barakah"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: barakah-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: .
      dockerfile: src/Modules/IdentityService/Dockerfile
    container_name: barakah-identity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Jwt__Secret: ${JWT_SECRET:-dev-only-secret-do-not-use-in-production-min-32-chars}
      Jwt__Issuer: barakah-identity-service
      Jwt__Audience: barakah-platform
    ports:
      - "5001:5001"

  tenant:
    build:
      context: .
      dockerfile: src/Modules/TenantService/Dockerfile
    container_name: barakah-tenant
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5003
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
    ports:
      - "5003:5003"

  catalog:
    build:
      context: .
      dockerfile: src/Modules/CatalogService/Dockerfile
    container_name: barakah-catalog
    depends_on:
      postgres:
        condition: service_healthy
      tenant:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5004
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Services__TenantService: http://tenant:5003
    ports:
      - "5004:5004"

  inventory:
    build:
      context: .
      dockerfile: src/Modules/InventoryService/Dockerfile
    container_name: barakah-inventory
    depends_on:
      postgres:
        condition: service_healthy
      tenant:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5005
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Services__TenantService: http://tenant:5003
    ports:
      - "5005:5005"

  kafka:
    # Bitnami stopped publishing versioned tags under bitnami/kafka on Docker Hub (2025) — the
    # apache/kafka image is maintained directly by the Apache Kafka project instead, KRaft mode
    # by default, no separate Zookeeper container, same single-node setup as before.
    image: apache/kafka:3.7.0
    container_name: barakah-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker cluster — internal topics (incl. __consumer_offsets, which Notification
      # Service's consumer group needs) default to replication factor 3 and would never come
      # online with only one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  order:
    build:
      context: .
      dockerfile: src/Modules/OrderService/Dockerfile
    container_name: barakah-order
    depends_on:
      postgres:
        condition: service_healthy
      tenant:
        condition: service_started
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5006
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Services__TenantService: http://tenant:5003
      Services__CatalogService: http://catalog:5004
      Services__InventoryService: http://inventory:5005
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "5006:5006"

  restaurant:
    build:
      context: .
      dockerfile: src/Modules/RestaurantService/Dockerfile
    container_name: barakah-restaurant
    depends_on:
      postgres:
        condition: service_healthy
      tenant:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5010
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Services__TenantService: http://tenant:5003
    ports:
      - "5010:5010"

  supershop:
    build:
      context: .
      dockerfile: src/Modules/SuperShopService/Dockerfile
    container_name: barakah-supershop
    depends_on:
      postgres:
        condition: service_healthy
      tenant:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5014
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Services__TenantService: http://tenant:5003
    ports:
      - "5014:5014"

  payment:
    build:
      context: .
      dockerfile: src/Modules/PaymentService/Dockerfile
    container_name: barakah-payment
    depends_on:
      postgres:
        condition: service_healthy
      tenant:
        condition: service_started
      order:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5007
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Services__TenantService: http://tenant:5003
      Services__OrderService: http://order:5006
    ports:
      - "5007:5007"

  pharmacy:
    build:
      context: .
      dockerfile: src/Modules/PharmacyService/Dockerfile
    container_name: barakah-pharmacy
    depends_on:
      postgres:
        condition: service_healthy
      tenant:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5008
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Services__TenantService: http://tenant:5003
    ports:
      - "5008:5008"

  notification:
    build:
      context: .
      dockerfile: src/Modules/NotificationService/Dockerfile
    container_name: barakah-notification
    depends_on:
      postgres:
        condition: service_healthy
      tenant:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5011
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Services__TenantService: http://tenant:5003
      Kafka__BootstrapServers: kafka:9092
      Kafka__GroupId: notification-service
    ports:
      - "5011:5011"

  analytics:
    build:
      context: .
      dockerfile: src/Modules/AnalyticsService/Dockerfile
    container_name: barakah-analytics
    depends_on:
      postgres:
        condition: service_healthy
      tenant:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5012
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=barakah;Username=barakah;Password=${POSTGRES_PASSWORD:-barakah_dev}
      Services__TenantService: http://tenant:5003
    ports:
      - "5012:5012"

volumes:
  postgres-data:
